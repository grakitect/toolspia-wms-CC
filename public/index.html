<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TOOLSPIA WMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M3 9L12 2L21 9V20C21 20.5304 20.7893 21.0391 20.4142 21.4142C20.0391 21.7893 19.5304 22 19 22H5C4.46957 22 3.96086 21.7893 3.58579 21.4142C3.21071 21.0391 3 20.5304 3 20V9Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 22V12H15V22" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="sidebar-logo-text">
            <span class="sidebar-logo-title">TOOLSPIA WMS</span>
            <span class="sidebar-logo-sub">Warehouse Management</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <button data-view="dashboard">
            <i data-lucide="layout-dashboard"></i>
            <span>대시보드</span>
          </button>

          <!-- 마스터 그룹 -->
          <div class="sidebar-group">
            <button class="sidebar-group-btn" data-group="master">
              <i data-lucide="database"></i>
              <span>기준 정보</span>
              <i data-lucide="chevron-down" class="sidebar-chevron"></i>
            </button>
            <div class="sidebar-group-body"><div>
              <button data-view="master" class="sidebar-sub">
                <i data-lucide="building-2"></i>
                <span>기본 정보</span>
              </button>
              <button data-view="products" class="sidebar-sub">
                <i data-lucide="package"></i>
                <span>상품 정보</span>
              </button>
              <button data-view="location-master" class="sidebar-sub">
                <i data-lucide="map-pin"></i>
                <span>로케이션 관리</span>
              </button>
              <button data-view="location-map" class="sidebar-sub">
                <i data-lucide="map"></i>
                <span>맵 에디터</span>
              </button>
              <button data-view="location-map-3d" class="sidebar-sub">
                <i data-lucide="box"></i>
                <span>맵 에디터 3D</span>
              </button>
            </div></div>
          </div>

          <!-- 입고 그룹 -->
          <div class="sidebar-group">
            <button class="sidebar-group-btn" data-group="inbound">
              <i data-lucide="package-plus"></i>
              <span>입고</span>
              <i data-lucide="chevron-down" class="sidebar-chevron"></i>
            </button>
            <div class="sidebar-group-body"><div>
              <button data-view="inbound" class="sidebar-sub">
                <i data-lucide="package-plus"></i>
                <span>입고 등록</span>
              </button>
              <button data-view="inbound-plan" class="sidebar-sub">
                <i data-lucide="clipboard-list"></i>
                <span>입고예정 1</span>
              </button>
              <button data-view="inbound-plan-2" class="sidebar-sub">
                <i data-lucide="clipboard-check"></i>
                <span>입고예정 2</span>
              </button>
            </div></div>
          </div>

          <!-- 출고 그룹 -->
          <div class="sidebar-group">
            <button class="sidebar-group-btn" data-group="outbound">
              <i data-lucide="package-minus"></i>
              <span>출고</span>
              <i data-lucide="chevron-down" class="sidebar-chevron"></i>
            </button>
            <div class="sidebar-group-body"><div>
              <button data-view="outbound" class="sidebar-sub">
                <i data-lucide="package-minus"></i>
                <span>출고 등록</span>
              </button>
              <button data-view="outbound-plan" class="sidebar-sub">
                <i data-lucide="truck"></i>
                <span>출고예정 관리</span>
              </button>
              <button data-view="outbound-upload-daiso" class="sidebar-sub">
                <i data-lucide="store"></i>
                <span>다이소</span>
              </button>
              <button data-view="outbound-upload-emart" class="sidebar-sub">
                <i data-lucide="store"></i>
                <span>이마트</span>
              </button>
              <button data-view="outbound-upload-lotte" class="sidebar-sub">
                <i data-lucide="store"></i>
                <span>롯데마트</span>
              </button>
            </div></div>
          </div>

          <!-- 재고 그룹 -->
          <div class="sidebar-group">
            <button class="sidebar-group-btn" data-group="stock">
              <i data-lucide="warehouse"></i>
              <span>재고</span>
              <i data-lucide="chevron-down" class="sidebar-chevron"></i>
            </button>
            <div class="sidebar-group-body"><div>
              <button data-view="stock" class="sidebar-sub">
                <i data-lucide="boxes"></i>
                <span>재고현황</span>
              </button>
              <button data-view="location-stock" class="sidebar-sub">
                <i data-lucide="map-pinned"></i>
                <span>로케이션별 재고</span>
              </button>
              <button data-view="adjust" class="sidebar-sub">
                <i data-lucide="refresh-cw"></i>
                <span>재고 조정 / 이동</span>
              </button>
              <button data-view="history" class="sidebar-sub">
                <i data-lucide="history"></i>
                <span>입출고 이력</span>
              </button>
            </div></div>
          </div>

          <!-- 관리 그룹 -->
          <div class="sidebar-group">
            <button class="sidebar-group-btn" data-group="manage">
              <i data-lucide="settings-2"></i>
              <span>관리</span>
              <i data-lucide="chevron-down" class="sidebar-chevron"></i>
            </button>
            <div class="sidebar-group-body"><div>
              <button data-view="alert" class="sidebar-sub">
                <i data-lucide="bell"></i>
                <span>알림</span>
              </button>
            </div></div>
          </div>
        </nav>
      </aside>

      <main class="main">
        <section id="view-dashboard" class="view"></section>
        <section id="view-master" class="view hidden"></section>
        <section id="view-products" class="view hidden"></section>
        <section id="view-stock" class="view hidden"></section>
        <section id="view-inbound" class="view hidden"></section>
        <section id="view-inbound-plan" class="view hidden"></section>
        <section id="view-inbound-plan-2" class="view hidden"></section>
        <section id="view-outbound" class="view hidden"></section>
        <section id="view-outbound-plan" class="view hidden"></section>
        <section id="view-outbound-upload-daiso" class="view hidden"></section>
        <section id="view-outbound-upload-emart" class="view hidden"></section>
        <section id="view-outbound-upload-lotte" class="view hidden"></section>
        <section id="view-adjust" class="view hidden"></section>
        <section id="view-history" class="view hidden"></section>
        <section id="view-alert" class="view hidden"></section>
        <section id="view-location-master" class="view hidden"></section>
        <section id="view-location-map" class="view hidden"></section>
        <section id="view-location-map-3d" class="view hidden"></section>
        <section id="view-location-stock" class="view hidden"></section>
      </main>
    </div>
    <script src="/app.js"></script>
    <script>
      if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
  </body>
</html>
