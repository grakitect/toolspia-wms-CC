<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>(CC) TOOLSPIA WMS</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>(CC) TOOLSPIA WMS</h1>
        <nav class="sidebar-nav">
          <button data-view="dashboard">대시보드</button>

          <div class="sidebar-label">마스터</div>
          <button data-view="master">기본 정보</button>
          <button data-view="products">상품 정보</button>
          <button data-view="stock">재고현황</button>

          <div class="sidebar-label">입고</div>
          <button data-view="inbound">입고 등록</button>
          <button data-view="inbound-plan" class="sidebar-sub">입고예정 1</button>
          <button data-view="inbound-plan-2" class="sidebar-sub">입고예정 2</button>

          <div class="sidebar-label">출고</div>
          <button data-view="outbound">출고 등록</button>
          <button data-view="outbound-plan" class="sidebar-sub">출고예정 관리</button>
          <button data-view="outbound-upload-daiso" class="sidebar-sub">다이소</button>
          <button data-view="outbound-upload-emart" class="sidebar-sub">이마트</button>
          <button data-view="outbound-upload-lotte" class="sidebar-sub">롯데마트</button>

          <div class="sidebar-label">관리</div>
          <button data-view="adjust">재고 조정 / 이동</button>
          <button data-view="history">입출고 이력</button>
          <button data-view="alert">알림</button>
        </nav>
      </aside>

      <main class="main">
        <section id="view-dashboard" class="view"></section>
        <section id="view-master" class="view hidden"></section>
        <section id="view-products" class="view hidden"></section>
        <section id="view-stock" class="view hidden"></section>
        <section id="view-inbound" class="view hidden"></section>
        <section id="view-inbound-plan" class="view hidden"></section>
        <section id="view-inbound-plan-2" class="view hidden"></section>
        <section id="view-outbound" class="view hidden"></section>
        <section id="view-outbound-plan" class="view hidden"></section>
        <section id="view-outbound-upload-daiso" class="view hidden"></section>
        <section id="view-outbound-upload-emart" class="view hidden"></section>
        <section id="view-outbound-upload-lotte" class="view hidden"></section>
        <section id="view-adjust" class="view hidden"></section>
        <section id="view-history" class="view hidden"></section>
        <section id="view-alert" class="view hidden"></section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
